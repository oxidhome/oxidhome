# Standalone workspace so the example builds for `wasm32-wasip2` without
# pulling the host (`oxidhome-core`) into the wasm build graph. Mirrors
# the layout used by the other examples; each carries its own
# `Cargo.lock` since path-back-into-parent crates aren't reachable for
# external plugin authors.
[workspace]
resolver = "3"
members = ["."]

[package]
name = "network-discovery"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
publish = false
description = "OxidHome example plugin: probes the LAN over UDP from the streaming-plugin world and publishes the replies."

[lib]
crate-type = ["cdylib"]

[dependencies]
# The streaming-plugin world: WASI sockets and HTTP, gated by the
# manifest's `[capabilities] network` rules.
oxidhome-sdk = { path = "../../crates/oxidhome-sdk", default-features = false, features = ["streaming-plugin"] }

[lints.rust]
unsafe_code = "deny"

[lints.cargo]
unused_dependencies = "deny"
