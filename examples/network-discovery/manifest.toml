manifest_version = 1

[plugin]
id = "example.network-discovery"
name = "Network Discovery"
version = "0.1.0"
authors = ["The OxidHome Contributors"]
description = "Broadcasts a UDP probe on the LAN and publishes the replies (streaming-plugin world)."
source = "https://github.com/oxidhome/oxidhome/tree/main/examples/network-discovery"
license = "MIT OR Apache-2.0"
keywords = ["example", "network", "discovery"]
world = "streaming-plugin"
sdk_version = "0.1.0"

[runtime]
wasm = "target/wasm32-wasip2/debug/network_discovery.wasm"
# Replies are drained on every tick. The host ticks the plugin early when
# a reply is readable (at least 100 ms after the previous tick), so the
# cadence is only a fallback.
tick_interval_ms = 60000

[capabilities]
# What the plugin may probe, and hear back from; the host refuses
# anything else. Broadcast needs a `udp` rule naming 255.255.255.255 and
# the port; the devices answer from their own addresses, which the
# private range covers (and with it the broadcast address of each
# 192.168.x network, for `local:9999` targets). Edit to match your
# network; the installer grants these rules explicitly.
network = ["udp://255.255.255.255:9999", "udp://192.168.0.0/16:9999"]
# The reply count.
storage_quota_kb = 4

[config.targets]
# Comma-separated targets to probe on start: `ip:port` (unicast or
# broadcast), or `local:<port>` for the broadcast address of each local
# IPv4 network the grant covers.
type = "string"
default = "255.255.255.255:9999"
description = "Targets to probe (ip:port or local:<port>, comma-separated)."

[config.probe]
type = "string"
default = "discover"
description = "Probe datagram payload."
