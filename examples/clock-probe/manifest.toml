manifest_version = 1

[plugin]
id = "example.clock-probe"
name = "Clock Probe"
version = "0.1.0"
authors = ["The OxidHome Contributors"]
description = "Publishes what its WASI wall and monotonic clocks read on each tick — virtual-clock test fixture."
source = "https://github.com/oxidhome/oxidhome/tree/main/examples/clock-probe"
license = "MIT OR Apache-2.0"
keywords = ["example", "test-fixture", "clock"]
world = "plugin"
sdk_version = "0.1.0"

[runtime]
wasm = "target/wasm32-wasip2/debug/clock_probe.wasm"
tick_interval_ms = 1000

[capabilities]
# Publishes bus-only custom events, which need no capability.
