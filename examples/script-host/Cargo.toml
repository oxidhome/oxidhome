# Standalone workspace so the example builds for `wasm32-wasip2` without
# pulling the host (`oxidhome-core`) into the wasm build graph.
[workspace]
resolver = "3"
members = ["."]

[package]
name = "script-host"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
publish = false
description = "OxidHome example plugin: a toy scripting plugin that runs each script in its own sandbox (ADR-0001)."

[lib]
crate-type = ["cdylib"]

[dependencies]
oxidhome-sdk = { path = "../../crates/oxidhome-sdk" }

[lints.rust]
unsafe_code = "deny"

[lints.cargo]
unused_dependencies = "deny"
