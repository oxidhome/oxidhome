// OxidHome v1 plugins service.
//
// Read side of the plugin catalogue: mirrors `GET /api/v1/plugins`
// on the JSON API. Aggregates the installed-plugin registry (added
// in 12-API-f) with the count of running instances per plugin id.
// Gated on `plugins:list`. Write-side (install / start / stop /
// uninstall) lands in the next slice.
syntax = "proto3";

package oxidhome.v1;

import "oxidhome/v1/tokens.proto";

// PluginsService — the installed-and/or-running plugin catalogue.
service PluginsService {
  // List every plugin the host knows about: entries in the
  // installed-plugin registry PLUS any dev-time argv-started
  // instances whose plugin id isn't in the registry
  // (`installed = false` for those rows).
  // Method name repeats the service noun so message names satisfy
  // buf's standard-naming rule uniquely across services — see
  // `InstancesService` for the same pattern.
  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse);

  // Install a plugin from a local source directory. Sensitive
  // (`plugins:install` scope) — copies operator-supplied code
  // into `<state_dir>/plugins/<plugin_id>/`. Same shape as
  // `POST /api/v1/plugins` on the JSON API.
  rpc InstallPlugin(InstallPluginRequest) returns (InstallPluginResponse);

  // Start a supervised instance of an installed plugin. Gated on
  // `plugins:start`. Same shape as
  // `POST /api/v1/plugins/{plugin_id}/start`; blocks until the
  // instance reaches `Running` before returning.
  rpc StartPlugin(StartPluginRequest) returns (StartPluginResponse);

  // Stop one or all running instances of a plugin. Gated on
  // `plugins:stop`. Idempotent — returns an empty `stopped_ids`
  // when nothing was running.
  rpc StopPlugin(StopPluginRequest) returns (StopPluginResponse);

  // Uninstall a plugin — removes `<state_dir>/plugins/<plugin_id>/`.
  // Sensitive (`plugins:uninstall` scope). Refuses with FAILED_PRECONDITION
  // if any instance of the plugin is running.
  rpc UninstallPlugin(UninstallPluginRequest) returns (UninstallPluginResponse);

  // Set a plugin's network grant (Phase 8.5). Every rule must lie
  // inside one the manifest requests: a grant narrows the request,
  // never widens it (INVALID_ARGUMENT otherwise). Running instances
  // restart under the new grant. `policy.manage`: the owner only.
  // Same shape as `PUT /api/v1/plugins/{plugin_id}/network-grant`.
  rpc SetPluginNetworkGrant(SetPluginNetworkGrantRequest) returns (SetPluginNetworkGrantResponse);

  // Reset a plugin's network grant to what its manifest requests,
  // restarting its running instances. `policy.manage`. Same shape as
  // `DELETE /api/v1/plugins/{plugin_id}/network-grant`.
  rpc ResetPluginNetworkGrant(ResetPluginNetworkGrantRequest) returns (ResetPluginNetworkGrantResponse);

  // A plugin's deny list (H6 slice 5), empty when the owner set none.
  // `policy.manage`. Same shape as `GET /api/v1/plugins/{plugin_id}/deny`.
  rpc GetPluginDeny(GetPluginDenyRequest) returns (PluginDeny);

  // Replace a plugin's deny list: what the plugin, or any plugin whose
  // call reaches another, may not do (`service.call`, `state.read`,
  // `blob.read`, `event.subscribe`), whatever its manifest grants. The
  // plugin need not be installed; running instances apply it at once.
  // An empty list removes it. `policy.manage`. Same shape as
  // `PUT /api/v1/plugins/{plugin_id}/deny`.
  rpc SetPluginDeny(SetPluginDenyRequest) returns (PluginDeny);

  // Remove a plugin's deny list. `policy.manage`. Same shape as
  // `DELETE /api/v1/plugins/{plugin_id}/deny`.
  rpc ResetPluginDeny(ResetPluginDenyRequest) returns (PluginDeny);
}

message ListPluginsRequest {}

message ListPluginsResponse {
  repeated Plugin plugins = 1;
}

message Plugin {
  // Manifest-resolved plugin id.
  string plugin_id = 1;
  // `true` if `<state_dir>/plugins/<plugin_id>/` is on disk — the
  // "installed and startable" state. `false` means a running
  // instance is registered but no matching install (the dev
  // argv-start path).
  bool installed = 2;
  // Manifest-declared semver, present when `installed = true`. The
  // JSON side sends `null` for the dev-argv rows; Connect uses
  // `optional string`.
  optional string version = 3;
  // How many supervised instances of this plugin are currently
  // registered. Zero for installed-but-stopped rows.
  uint32 instance_count = 4;
  // The installation's network rules (Phase 8.5), present when
  // `installed = true` (empty lists for a plugin without network
  // rules). Same lists as the JSON side's `network` object; ProtoJSON
  // omits an empty list, so a plugin without rules encodes as `{}`.
  optional NetworkGrants network = 5;
}

// A plugin's `[capabilities] network` rules, in manifest syntax
// (`tcp://192.168.1.0/24:554`, `https://*.example.com`).
message NetworkGrants {
  // What the manifest asks for.
  repeated string requested = 1;
  // What the operator's persisted grant holds; equal to `requested`
  // unless the grant was narrowed.
  repeated string granted = 2;
  // What instances actually get: the grant narrowed by containment
  // against the request. A granted rule only partly inside the
  // request is absent here.
  repeated string effective = 3;
}

message InstallPluginRequest {
  // Path on the daemon-local filesystem to a directory containing
  // `manifest.toml` + the manifest's `runtime.wasm` file. The host
  // reads the manifest to extract the canonical plugin id, then
  // recursively copies the tree into
  // `<state_dir>/plugins/<plugin_id>/` via a `.staging-<id>`
  // rename for atomicity. Must be absolute and must not contain
  // `..` components; otherwise the call fails with
  // `invalid_argument`.
  string source_dir = 1;
}

message InstallPluginResponse {
  string plugin_id = 1;
  string version = 2;
  // Absolute path where the install landed
  // (`<state_dir>/plugins/<plugin_id>/`) — the daemon's canonical
  // location, useful for logs / CLI display.
  string installed_path = 3;
}

message StartPluginRequest {
  // Plugin to start (from `ListPlugins`).
  string plugin_id = 1;
  // Optional instance id — defaults to the plugin id on the JSON
  // side.
  optional string instance_id = 2;
  // Optional TOML-shaped config overrides, encoded as JSON so it
  // rides the proto wire cleanly. Empty / absent means "use the
  // manifest defaults."
  optional string config_overrides_json = 3;
}

message StartPluginResponse {
  string plugin_id = 1;
  string instance_id = 2;
  // `Debug` repr of the supervisor's state after `wait_for_running`
  // returns. `Running` on success; a `Failed { ... }` variant if
  // the supervisor reached terminal before `Running`.
  string state = 3;
}

message StopPluginRequest {
  string plugin_id = 1;
  // If set, stops just this one instance; otherwise every running
  // instance of `plugin_id` is stopped.
  optional string instance_id = 2;
}

message StopPluginResponse {
  // Instance ids the stop call actually stopped. Empty on
  // idempotent success (nothing was running).
  repeated string stopped_ids = 1;
}

message UninstallPluginRequest {
  string plugin_id = 1;
}

message UninstallPluginResponse {
  string plugin_id = 1;
}

message SetPluginNetworkGrantRequest {
  string plugin_id = 1;
  // The rules to grant, in manifest syntax. Empty grants no network
  // access.
  repeated string rules = 2;
}

message SetPluginNetworkGrantResponse {
  NetworkGrantChange change = 1;
}

message ResetPluginNetworkGrantRequest {
  string plugin_id = 1;
}

message ResetPluginNetworkGrantResponse {
  NetworkGrantChange change = 1;
}

// The result of a network grant change.
message NetworkGrantChange {
  string plugin_id = 1;
  // The plugin's rules after the change, as `ListPlugins` shows them.
  NetworkGrants network = 2;
  // Instances restarted under the new grant.
  repeated string restarted = 3;
  // Instances that were running but didn't restart.
  repeated NotRestartedInstance not_restarted = 4;
}

// An instance a grant change didn't restart: still stopping past the
// wait limit (it picks the grant up when started again), or its start
// failed.
message NotRestartedInstance {
  string instance_id = 1;
  string reason = 2;
}

message GetPluginDenyRequest {
  string plugin_id = 1;
}

message SetPluginDenyRequest {
  string plugin_id = 1;
  // Deny entries; `*` names every plugin action.
  repeated Selector deny = 2;
}

message ResetPluginDenyRequest {
  string plugin_id = 1;
}

// A plugin's deny list after a read or change.
message PluginDeny {
  string plugin_id = 1;
  repeated Selector deny = 2;
}
