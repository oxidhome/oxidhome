// OxidHome v1 events service.
//
// Server-streaming counterpart to the JSON `GET /api/v1/events/tail`
// WebSocket: opens a durable subscription to the host event bus and
// yields one message per bus event until the client disconnects or
// the daemon shuts down. First streaming RPC in the Connect surface
// — every other cluster is unary.
//
// Same lagged-notice semantics as the JSON WebSocket: if the client
// falls behind its per-subscriber queue, events are dropped and the
// stream emits a `Lagged` variant carrying the gap size and the
// cursor to resume from. Gated on `events:tail` (plus `events:read`
// when `after_id` is set) — the middleware runs auth once before the
// stream is established, and a scope denial short-circuits before
// the first message is emitted.
//
// H4 resume protocol: with `after_id` set, the stream first replays
// every history row with `row_id > after_id` in id order, then
// switches to live delivery with no gap and no duplicate (see
// ARCHITECTURE.md "Event delivery"). If the cursor can't be honored
// (pruned by retention, or ahead of history after a restore), the
// stream emits one `CursorExpired` message and ends.
syntax = "proto3";

package oxidhome.v1;

// `KeyValue` + `Value` are defined alongside `DevicesService`
// (device-command args land there first). Reused here for the
// `StateChanged.fields` list — same shape as the state-map values
// devices return.
import "oxidhome/v1/devices.proto";

service EventsService {
  // Subscribe to the host event bus. v1 streams every event; filter
  // fields (topic prefix, device id) are a follow-up.
  rpc TailEvents(TailEventsRequest) returns (stream TailEventsResponse);
}

message TailEventsRequest {
  // H4: resume cursor. Unset = live only (events published after
  // the subscription opens). Set = replay history rows with
  // `row_id > after_id`, then continue live; every row id is
  // delivered exactly once and in increasing order. `0` starts at
  // the oldest retained row. Requires the `events:read` scope in
  // addition to `events:tail`.
  optional uint64 after_id = 1;
}

// Each streamed message is either a bus event (via [`Event`]) or a
// lagged-broadcast notice. Modeled as a `oneof` so a client that
// only cares about real events pattern-matches on the variant and
// ignores the sentinel; a client that wants to react to backpressure
// gets a first-class field to look at.
message TailEventsResponse {
  oneof body {
    // An event delivered by the host bus.
    Event event = 1;
    // The broadcast channel dropped `skipped` events because this
    // subscriber fell behind capacity. Same shape as the JSON
    // side's `{"lagged": N}` sentinel frame.
    Lagged lagged = 2;
    // H4: `after_id` (or a row this stream still had to replay)
    // is no longer in history. Always the last message: the stream
    // ends after it. Reopen with `after_id = head_id`, then rebuild
    // device state from the state snapshot and its revision cursor
    // (`/api/v1/devices/state`, then `/state/changes`).
    CursorExpired cursor_expired = 3;
  }
}

// Mirrors the WIT `event` record from `oxidhome::plugin::events`.
// The JSON `WireEvent` shape ships the same field set — the
// `topic` field the JSON side synthesizes at the top level is
// omitted here since Connect clients can derive it from the
// `payload` variant directly.
message Event {
  // Device the event is attributable to. Empty for bus-only
  // (plugin lifecycle, custom-topic) events.
  optional string device_id = 1;
  // Millisecond Unix timestamp — plugin-supplied at publish time
  // (see the WIT `event.timestamp` docstring). `uint64` matches
  // the WIT `unix-ms` type; encoding as `int64` would wrap large
  // values past `i64::MAX` back to negative on the wire.
  uint64 timestamp_ms = 2;
  // Payload variants map one-to-one to WIT `event-payload`.
  oneof payload {
    StateChanged state_changed = 3;
    Button button = 4;
    Inference inference = 5;
    CustomEvent custom = 6;
  }
  // Plugin id (`plugin.id` from the publisher's manifest) that
  // produced this event. **Host-populated** — the host overwrites
  // any client-supplied value before the event is broadcast, so
  // subscribers can trust this as the immutable event origin.
  // Mirror of WIT `event.origin-plugin-id`.
  string origin_plugin_id = 7;
  // Instance id of the publishing plugin instance. Same host-
  // populated contract as `origin_plugin_id`; together they
  // uniquely identify the publisher. Mirror of WIT
  // `event.origin-instance-id`.
  string origin_instance_id = 8;
  // H5: durable `event_log` row id assigned when this event was
  // persisted. A tail client saves the highest observed `row_id`
  // and passes it as `after_id` to the history query to reconcile
  // across a reconnect. `0` (proto3 default) means the event is
  // not in history: the host's event-log mirror was degraded
  // (H3: disk full or failing; history gets a
  // `host.event_log.gap` marker row on recovery) or the event came
  // from a host-side simulator. Don't advance the cursor on `0`.
  uint64 row_id = 9;
}

// Wire mirror of WIT `state-change` — the full record, not just
// the capability tag. Includes the partial-state `fields` so a
// Connect client can learn the new value from the event itself,
// same shape a `Devices.Get` (once it exists) would return. The
// PR #75 review flagged the earlier capability-only shape as
// silently dropping the actual changed values, since neither
// `Devices.List` nor any other RPC surfaces device state today.
message StateChanged {
  // The capability whose state changed (`"switch"`, `"dimmer"`,
  // `"lock"`, …).
  string capability = 1;
  // New values for the changed fields (partial state — a subset
  // of the device's full state vector). Same tagged-value shape
  // as device-command arguments.
  repeated KeyValue fields = 2;
}

message Button {
  // Which kind of button event fired. Mirrors the WIT
  // `button-event` variant tags one-for-one.
  ButtonKind kind = 1;
  // Rotary delta for `BUTTON_KIND_ROTATED` (positive = clockwise).
  // Unused for the other variants (proto3 default = 0.0).
  double delta = 2;
}

enum ButtonKind {
  BUTTON_KIND_UNSPECIFIED = 0;
  BUTTON_KIND_PRESSED = 1;
  BUTTON_KIND_RELEASED = 2;
  BUTTON_KIND_SINGLE_PRESS = 3;
  BUTTON_KIND_DOUBLE_PRESS = 4;
  BUTTON_KIND_LONG_PRESS = 5;
  BUTTON_KIND_ROTATED = 6;
}

// Wire mirror of WIT `inference-result` — detection bboxes,
// classification scores, embeddings, etc. Plugin-specific schema
// lives in the JSON `payload` body; `model` names the pipeline
// that produced this result.
message Inference {
  string model = 1;
  string payload = 2;
  // Frame timestamp (Unix ms) if applicable, `None` otherwise.
  // `uint64` matches the WIT `unix-ms` type — see the note on
  // `Event.timestamp_ms`.
  optional uint64 frame_timestamp_ms = 3;
}

message CustomEvent {
  // Free-form topic string. Same field name the JSON WebSocket
  // uses (`payload.topic`).
  string topic = 1;
  // Opaque payload body — plugins pick their own encoding.
  string payload = 2;
}

message Lagged {
  // Count of events the subscriber queue dropped since this
  // subscriber last saw a message. Matches the JSON WebSocket's
  // `{"lagged": N}` shape.
  uint64 skipped = 1;
  // H4: highest row id this stream delivered before the drop.
  // Without `after_id` the stream stays live-only and lossy;
  // reopen with `after_id = resume_after_id` to recover the dropped
  // events that are in history. With `after_id` the stream re-reads
  // them from history itself, so this notice is informational
  // (dropped events without a row id are not in history and are
  // lost either way). Unset if no event with a row id was
  // delivered yet.
  optional uint64 resume_after_id = 2;
}

// H4: the requested cursor can't be resumed without a gap.
message CursorExpired {
  // The cursor that couldn't be honored: the request's `after_id`,
  // or the last row id this stream delivered when a row it still
  // had to replay was pruned mid-stream.
  uint64 after_id = 1;
  // Oldest row id still in history. Unset if history is empty.
  optional uint64 oldest_id = 2;
  // Highest row id ever assigned. A cursor above it (e.g. after a
  // restore from an older backup) is expired too.
  uint64 head_id = 3;
}
