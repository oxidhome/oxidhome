// OxidHome v1 tokens and roles services.
//
// Roles, and API tokens minted by role: mirrors `/api/v1/roles` and
// `/api/v1/tokens` on the JSON API. Roles need `policy.manage`, tokens
// `token.manage`; only the owner token (the bootstrap / recovered
// admin token) holds either. No role grants them.
syntax = "proto3";

package oxidhome.v1;

// TokensService — API tokens, by role.
service TokensService {
  // Mint a token. The response carries its bearer secret, once; the
  // host keeps only the hash. Refuses an unknown role, `owner` (only
  // the host assigns it) and the reserved `admin` label with
  // INVALID_ARGUMENT.
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse);

  // List every token with its owner flag and roles. Never returns a
  // secret or hash.
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse);
}

// RolesService — the built-in roles (`admin`, `member`, `guest`,
// `agent`) and the owner's custom ones. A token holds roles by name:
// an edit applies to every token holding it from its next request on.
service RolesService {
  // The built-in roles, then the custom ones by name.
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);

  // Define a custom role. ALREADY_EXISTS for a taken name;
  // INVALID_ARGUMENT for a bad or built-in name or bad grants.
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);

  // Replace a custom role's grants. NOT_FOUND for an unknown name.
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);

  // Delete a custom role. FAILED_PRECONDITION while live tokens hold
  // it.
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
}

message CreateTokenRequest {
  // Operator-facing name, 1 to 64 characters. Not `admin`.
  string label = 1;
  // Names of the roles the token holds, built-in or custom. At least
  // one.
  repeated string roles = 2;
}

// One grant of a role: `actions`, optionally narrowed to device
// categories and devices. A sensitive category (`lock`, `opener`,
// `alarm`, `camera`) is reached only by a grant whose `category`
// names it.
message Grant {
  // Action names (`device.command`) or `*` for every action a role can
  // grant. Required.
  repeated string actions = 1;
  // Device categories the grant is narrowed to; empty for every
  // resource.
  repeated string category = 2;
  // Device ids or `prefix*` patterns the grant is narrowed to; empty
  // for every device.
  repeated string devices = 3;
}

message CreateTokenResponse {
  // The bearer secret (`oxh_...`). Shown once.
  string secret = 1;
  // The new token as listed.
  Token token = 2;
}

message ListTokensRequest {}

message ListTokensResponse {
  repeated Token tokens = 1;
}

// One token, as listed. Same fields as the JSON API's rows.
message Token {
  string token_id = 1;
  string label = 2;
  // `true` for the bootstrap / recovered owner token, which may do
  // everything.
  bool owner = 3;
  bool revoked = 4;
  // Names of the roles the token holds.
  repeated string roles = 5;
  // Unix ms.
  int64 created_ms = 6;
  // Unix ms; unset when never used.
  optional int64 last_used_ms = 7;
}

// One role, as listed. Same fields as the JSON API's rows.
message Role {
  string name = 1;
  // `true` for a built-in role.
  bool builtin = 2;
  // Grants as `actions[@categories][ [devices]]`.
  repeated string grants = 3;
  // Ids of the live tokens holding the role.
  repeated string tokens = 4;
  // Unix ms; unset for a built-in role.
  optional int64 created_ms = 5;
  optional int64 updated_ms = 6;
}

message ListRolesRequest {}

message ListRolesResponse {
  repeated Role roles = 1;
}

message CreateRoleRequest {
  // 1 to 32 of `a-z0-9-_`, starting with a letter; not `owner` or a
  // built-in role's name.
  string name = 1;
  repeated Grant grants = 2;
}

message CreateRoleResponse {
  Role role = 1;
}

message UpdateRoleRequest {
  string name = 1;
  repeated Grant grants = 2;
}

message UpdateRoleResponse {
  Role role = 1;
}

message DeleteRoleRequest {
  string name = 1;
}

message DeleteRoleResponse {
  // The deleted role.
  Role role = 1;
}
