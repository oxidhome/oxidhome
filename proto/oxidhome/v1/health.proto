// OxidHome v1 health-check service.
//
// Mirrors `GET /api/v1/health` on the existing JSON API surface —
// anonymous liveness probe used by service meshes, container
// orchestrators, and the upcoming CLI. The Connect endpoint lives
// alongside the JSON one on the same listener; both protocols
// stay supported until the CLI / UI move over fully (see
// ARCHITECTURE.md for the migration plan).
syntax = "proto3";

package oxidhome.v1;

// HealthService — anonymous liveness probe for the daemon. No
// authentication required; it carries "the daemon is up and the API
// surface is wired" plus the durable event-log mirror's state.
service HealthService {
  // Check returns the daemon's identity + version. Always returns
  // OK on a reachable daemon. The future plugin-health rollup (which
  // would surface per-plugin trap state) lands on a separate RPC
  // when there's a real consumer.
  rpc Check(CheckRequest) returns (CheckResponse);
}

message CheckRequest {}

message CheckResponse {
  // Always "ok" on a reachable daemon. A degraded event-log mirror
  // does not change it (live control and delivery still work); see
  // `event_log`.
  string status = 1;

  // `cargo`-resolved version of `oxidhome-core` — same value the
  // JSON `/api/v1/health` endpoint reports.
  string version = 2;

  // State of the durable event-log mirror (H3): "ok", or "degraded"
  // while event_log writes are failing and live events are delivered
  // without a row id. Same value as `event_log` on
  // `GET /api/v1/readyz`; details are on the authenticated MCP
  // `oxidhome://status` resource.
  string event_log = 3;

  // State of the durable device-state projection (H2): "ok", or
  // "degraded" while flushes to the database are failing (live state
  // and control still work; changes since the last flush would be
  // lost on a crash). Same value as `device_state` on
  // `GET /api/v1/readyz`; details are on the authenticated MCP
  // `oxidhome://status` resource.
  string device_state = 4;
}
