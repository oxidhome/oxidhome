// OxidHome v1 devices service.
//
// Read side of the device catalogue: mirrors
// `GET /api/v1/devices` on the JSON API. Gated on the
// `devices:list` scope. Write-side (`Devices.Command`) lands in
// the next slice.
syntax = "proto3";

package oxidhome.v1;

// DevicesService — plugin-registered devices the household holds.
service DevicesService {
  // List every device any supervised instance has registered with
  // the host. Snapshot; the ordering isn't stable across requests.
  // Method noun repeats the service (`ListDevices`) so the message
  // names don't collide with the other services' `ListRequest` /
  // `ListResponse` — see the analogue on `InstancesService`.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);

  // Execute a capability command against a device. Sensitive
  // (`devices:command` scope) — controls physical actuation
  // (switches, dimmers, locks). Same routing as the JSON
  // `POST /api/v1/devices/{id}/command`: the host looks up the
  // device's owning instance and forwards `execute-command` to
  // it. Unknown device and non-running owner both collapse to
  // NotFound (no enumeration leak). Every routed command returns OK
  // with a host-minted `command_id` and an explicit
  // `command_outcome` (H5, ADR-0003).
  rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);

  // H2: current state of one device from the host-owned projection.
  // Mirrors `GET /api/v1/devices/{id}/state`; `devices:read`. An
  // unknown device returns an empty `capabilities` list, not an
  // error. `bytes_val` fields are withheld without `blobs:read` (M7).
  rpc GetDeviceState(GetDeviceStateRequest) returns (GetDeviceStateResponse);

  // H2: one page of the full-store snapshot, the resync primitive.
  // Mirrors `GET /api/v1/devices/state`; `devices:read`. A malformed
  // `cursor` is `invalid_argument`; a cursor from an earlier daemon
  // process or another store epoch is `aborted` (restart the resync
  // without a cursor).
  rpc ListDeviceState(ListDeviceStateRequest) returns (ListDeviceStateResponse);

  // H2: cursor catch-up over the projection. Mirrors
  // `GET /api/v1/devices/state/changes`; `devices:read`.
  rpc ListDeviceStateChanges(ListDeviceStateChangesRequest) returns (ListDeviceStateChangesResponse);
}

message ListDevicesRequest {}

message ListDevicesResponse {
  repeated Device devices = 1;
}

message Device {
  // Host-assigned device id — the routing key for command dispatch.
  string device_id = 1;
  // Owning plugin-instance id (whose `execute-command` receives
  // routed commands for this device).
  string owner_instance = 2;
  // Human-readable name from the plugin's `DeviceInfo` at
  // registration time.
  string name = 3;
  // Host-derived category (`lock`, `opener`, `alarm`, `camera`,
  // `light`, `climate`, `media`, `switch`, `sensor` or `other`), after
  // any operator raise.
  string category = 4;
  // Sensitive categories the device falls under (`lock`, `opener`,
  // `alarm`, `camera`). A token needs an explicit grant for each: no
  // scope, the wildcard included, reaches a command on a lock, opener
  // or alarm, or a camera's bytes.
  repeated string sensitive = 5;
}

message ExecuteCommandRequest {
  // Host-assigned device id (from `ListDevices` or a `state-changed`
  // event).
  string device_id = 1;
  // Capability key — `"switch"`, `"dimmer"`, etc. — that the
  // plugin's `execute-command` matches on alongside `action`.
  string capability = 2;
  // Action verb — `"set"`, `"toggle"`, `"increment"`, … — the
  // plugin's command dispatch interprets.
  string action = 3;
  // `key=value` arguments the command takes. Order is preserved
  // client → host → plugin; capabilities that treat args as a
  // dict resolve duplicates plugin-side.
  repeated KeyValue args = 4;
}

// One-of-many typed value that arg values and state entries carry.
// Mirrors the host-side `WIT value` variant and the JSON `WireValue`
// tagged shape, just structured as a proto `oneof` so gRPC /
// protobuf clients see a typed union rather than a stringly-tagged
// blob.
message Value {
  oneof kind {
    bool bool_val = 1;
    int64 int_val = 2;
    double float_val = 3;
    string string_val = 4;
    bytes bytes_val = 5;
    // Free-form JSON body — carries payloads that don't fit the
    // typed variants above (nested objects, sparse arrays, …).
    string json_val = 6;
  }
}

message KeyValue {
  string key = 1;
  Value value = 2;
}

message ExecuteCommandResponse {
  // Outcome detail. `ok` / `ok_with_state` mean `completed`, `err`
  // means `rejected`; the H5 cases below cover the rest. Read
  // `command_outcome` for the state itself.
  oneof outcome {
    // Command executed, no state readout.
    Ok ok = 1;
    // Command executed and returned a fresh state snapshot the
    // caller should treat as authoritative until the next
    // `state-changed` event.
    OkWithState ok_with_state = 2;
    // The plugin (or the host) refused the command before acting.
    // RPC-level failures (unknown device, no running owner) come back
    // as ConnectError codes on the wire.
    ExecuteCommandError err = 3;
    // H5: the plugin took the command and finishes it asynchronously.
    Accepted accepted = 6;
    // H5: the deadline passed before the plugin started; the command
    // did not run.
    TimedOut timed_out = 7;
    // H5: the command may or may not have taken effect.
    OutcomeUnknown outcome_unknown = 8;
  }

  // H5: host-minted id of this command dispatch (`cmd-<32 hex>`),
  // recorded in the audit trail.
  string command_id = 4;
  // H5: the explicit outcome.
  CommandOutcome command_outcome = 5;

  message Ok {}

  message OkWithState {
    repeated KeyValue state = 1;
  }

  message Accepted {}

  message TimedOut {
    string message = 1;
  }

  message OutcomeUnknown {
    string message = 1;
  }
}

// H5 (ADR-0003): how a device command ended.
enum CommandOutcome {
  COMMAND_OUTCOME_UNSPECIFIED = 0;
  // Taken by the plugin; the final result is recorded later.
  COMMAND_OUTCOME_ACCEPTED = 1;
  // The plugin reported success.
  COMMAND_OUTCOME_COMPLETED = 2;
  // Refused before acting; safe to retry once the cause is fixed.
  COMMAND_OUTCOME_REJECTED = 3;
  // The deadline passed before the plugin started; safe to retry.
  COMMAND_OUTCOME_TIMED_OUT = 4;
  // May or may not have taken effect; read the device state before
  // retrying.
  COMMAND_OUTCOME_UNKNOWN = 5;
}

// Wire mirror of the WIT `error` variant returned by the plugin.
message ExecuteCommandError {
  oneof kind {
    string not_found = 1;
    string permission_denied = 2;
    string invalid_argument = 3;
    string unavailable = 4;
    string internal = 5;
  }
}

// H2: freshness of a projected state entry.
enum StateQuality {
  STATE_QUALITY_UNSPECIFIED = 0;
  // The owning instance is live and reported this value.
  STATE_QUALITY_FRESH = 1;
  // The owner stopped, the device or capability was removed, or the
  // value was restored at boot and not yet republished.
  STATE_QUALITY_STALE = 2;
}

// H2: the current value of one capability on one device.
message DeviceStateEntry {
  string device_id = 1;
  string capability = 2;
  // Merged current fields.
  repeated KeyValue fields = 3;
  // Store-wide revision at write time; the only ordering axis.
  uint64 global_revision = 4;
  // Host wall clock (ms) when the value was applied.
  int64 received_ms = 5;
  // Plugin-supplied observation time (ms); informational.
  uint64 observed_ms = 6;
  // Supervisor generation of the owner at write time.
  uint64 source_generation = 7;
  StateQuality quality = 8;
}

// H2: every projected capability of one device, read atomically.
message DeviceStateSnapshot {
  string device_id = 1;
  // Opaque store epoch; changes only when the projection is discarded.
  string epoch = 2;
  // Store revision of the read (or the pinned resync revision).
  uint64 revision = 3;
  repeated DeviceStateEntry capabilities = 4;
}

message GetDeviceStateRequest {
  string device_id = 1;
}

message GetDeviceStateResponse {
  DeviceStateSnapshot state = 1;
}

message ListDeviceStateRequest {
  // Opaque continuation cursor from `next_cursor`; empty for the
  // first page.
  string cursor = 1;
  // Devices per page; 0 means the default (64), capped at 256.
  uint32 limit = 2;
}

message ListDeviceStateResponse {
  string epoch = 1;
  // Resync anchor: the first page's revision, echoed on every page.
  // After the last page, use it as `since_revision`.
  uint64 revision = 2;
  repeated DeviceStateSnapshot devices = 3;
  // Empty on the last page.
  string next_cursor = 4;
  // The page holds fewer than `limit` devices because it reached the
  // server's byte budget (an upper bound on the encoded size, kept
  // well under a 4 MiB receive limit) or its scan budget;
  // `next_cursor` is set. The first device is always sent whole.
  bool truncated = 5;
}

message ListDeviceStateChangesRequest {
  // Return entries with `global_revision > since_revision`.
  uint64 since_revision = 1;
  // 0 means the default (256), capped at 1024.
  uint32 limit = 2;
}

message ListDeviceStateChangesResponse {
  string epoch = 1;
  uint64 current_revision = 2;
  // Latest value of each changed slot, ascending by revision.
  repeated DeviceStateEntry changes = 3;
  // The cursor is invalid (above the current revision, below the
  // eviction watermark, or inside a revision range skipped at boot):
  // resync with `ListDeviceState`.
  bool reset_required = 4;
  // The server's byte budget cut the page short: more changes follow
  // even though `changes` holds fewer than `limit` entries. Advance
  // the cursor to the highest returned revision and poll again.
  bool truncated = 5;
}
