[package]
name = "oxidhome-test-host"
description = "OxidHome plugin test harness — runs a plugin component in-process on the production host runtime, with assertion helpers for tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Depends on `oxidhome-core`, which is `publish = false` through 0.x
# (see the publication policy in ARCHITECTURE.md "Implementation
# decisions"). The harness flips publishable together with it.
publish = false
# Integration tests are listed explicitly so cargo doesn't pick up
# `tests/support.rs` as a test target of its own; each test pulls it
# in with `#[path]`, the same layout `oxidhome-core` uses.
autotests = false

[lints]
workspace = true

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "test_host"
path = "tests/test_host.rs"

[dependencies]
# The harness runs plugins on the production runtime: same loader,
# same host-import impls, same state stores (on a throwaway state
# dir). See the crate docs and architecture-review item M5.
anyhow.workspace = true
oxidhome-core.workspace = true
oxidhome-manifest.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
