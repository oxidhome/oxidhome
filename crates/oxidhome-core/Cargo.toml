[dependencies]
# Pinned exactly. Wasmtime's component-model API surface evolves; we want
# silent minor bumps to be deliberate. Bumps land as their own PR. Mirrors
# the `wit-bindgen` pin policy in oxidhome-wit.
#
# `wasmtime-wasi-http` joins this list in Phase 8 when streaming plugins
# need outgoing HTTP. Phase 2 wires `wasmtime-wasi`'s p2 (clocks, io, cli,
# random, …) so libstd-pulled WASI imports resolve.
wasmtime = { version = "=48.0.1", default-features = false, features = [
  "runtime",
  "component-model",
  "async",
  "cranelift",
  "std",
  # `anyhow` here flips on `From<wasmtime::Error> for anyhow::Error` so
  # the host-runtime `?` plumbing keeps working with `anyhow::Result`.
  "anyhow",
] }
wasmtime-wasi = { version = "=48.0.1", default-features = false, features = ["p2"] }
anyhow.workspace = true
oxidhome-manifest.workspace = true
rusqlite.workspace = true
semver.workspace = true
# `serde` + `serde_json` carry the on-disk KV encoding (tagged enum →
# JSON BLOB) — see `state::kv::StoredValue`. Postcard-style compact
# encoding can drop in later without a schema migration: the store
# treats values as opaque bytes.
serde = { workspace = true }
serde_json.workspace = true
serde_urlencoded.workspace = true
base64.workspace = true
# Phase 13 round-3 F1: meta-validate a plugin's declared
# `ui.config-schema` / `ui.commands-schema` files as JSON Schema
# draft 2020-12 at install and boot-scan. The manifest validator
# in `oxidhome-manifest` checks *paths*; this compiles the actual
# schema documents so a manifest declaring `ui/config.schema.json`
# whose contents are malformed JSON — or a valid JSON blob that
# isn't a valid JSON Schema — fails the install rather than
# reaching the UI serving path.
jsonschema.workspace = true
# Phase 14: MCP server (built-in surface for LLM agents).
# `server`+`macros` only — transport lives on our existing
# axum stack, auth reuses our token store.
rmcp.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "fs", "net", "time", "signal"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "registry"] }

# Phase 12 — external HTTP/WS API.
axum.workspace = true
rand.workspace = true
sha2.workspace = true
tower.workspace = true

# `O_NOFOLLOW` constant for `read_no_follow_within` — closes the
# check-then-open TOCTOU window on install-time / scan-time reads
# of manifest.toml + plugin.wasm. Unix-only; the Windows fallback
# in that helper doesn't need libc.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Connect RPC. `oxidhome-proto` holds the generated service traits;
# `connectrpc` provides the Router that mounts onto axum via
# `into_axum_service()`.
connectrpc.workspace = true
oxidhome-proto.workspace = true
# `futures-util` was originally a dev-dep for the 12-API-e WS
# round-trip test; 15-e's `Events.TailEvents` server-streaming
# handler builds its response stream via `futures::stream::unfold`
# so the dep moves up to a regular dep. Still one lockfile copy —
# the dev tests keep pulling it via this same workspace pin.
futures-util.workspace = true
# The MCP admission middleware calls `axum::body::to_bytes` with a
# size cap and needs to distinguish "hit the cap → 413 Payload Too
# Large" from other body-read failures. `to_bytes` sets a
# `LengthLimitError` on the error's `source()`; this dep lets the
# middleware downcast to it. `http-body-util` is already in the
# lockfile via `axum`, so lifting it to a workspace dep here
# doesn't grow the dep graph.
http-body-util.workspace = true
# 14.2c round-4 F1: the MCP admission gate wraps every
# response body with a `PermitBody` type that impls
# `http_body::Body` directly. `http-body-util` re-exports the
# trait but not by path we can name; lift the trait crate to
# a workspace dep so the impl compiles.
http-body.workspace = true
bytes.workspace = true

[dev-dependencies]
# 12-API-e — real WS round-trip test. Already in the dep graph via
# `axum`'s `ws` feature, pinned to the same version so the lockfile
# stays single-copy.
tokio-tungstenite.workspace = true
# `http-body-util` is now a regular dep (see above); the 15-e
# Connect server-streaming test and the 14.1 MCP handshake test
# both use `BodyExt::frame()` off it.
