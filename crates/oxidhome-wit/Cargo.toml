[package]
name = "oxidhome-wit"
description = "OxidHome guest-side WIT bindings (wit-bindgen output for the four plugin worlds). Internal crate; consumed by oxidhome-sdk."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
# Plugin authors enable exactly **one** world feature on guest (wasm)
# builds — wit-bindgen embeds one component-type custom section per
# `generate!` invocation, and `wasm-component-ld` rejects binaries with
# more than one world's metadata. Tests on native targets enable all
# four to validate every world's bindings.
default = ["plugin"]
plugin = []
streaming-plugin = []
ai-plugin = []
streaming-ai-plugin = []

[dependencies]
# Exact pin (see the root Cargo.toml).
wit-bindgen.workspace = true

[dev-dependencies]
# `tests/contract_baseline.rs`: print the normalized `oxidhome:plugin`
# package, compare it against `baselines/`, and semver-check version
# bumps (architecture review M1).
semver.workspace = true
wit-component = { workspace = true, features = ["semver-check"] }
wit-parser.workspace = true
