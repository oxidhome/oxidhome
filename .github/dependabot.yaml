version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ci:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    # The wasm toolchain moves together onto one wasm-tools release
    # (a skew breaks the build, #200); .github/workflows/wasm-toolchain.yaml
    # bumps it, so Dependabot leaves these crates alone.
    ignore:
      - dependency-name: "wasmtime*"
      - dependency-name: "wit-*"
      - dependency-name: "wasm-encoder"
      - dependency-name: "wasm-metadata"
      - dependency-name: "wasmparser"
      - dependency-name: "wasmprinter"
      - dependency-name: "wasm-compose"
      - dependency-name: "wasm-wave"
      - dependency-name: "wast"
      - dependency-name: "wat"
      - dependency-name: "cranelift-*"
      - dependency-name: "pulley-*"
