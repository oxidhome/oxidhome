version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ci:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      # wasmtime and the wasm-tools crates it pulls in move together:
      # `wit-parser` / `wit-component` are pinned to wasmtime's versions
      # and share types, so a lone bump of one breaks the build (#200).
      # `wit-bindgen` stays out on purpose: its exact pin is bumped in
      # its own PR (AGENTS.md, root Cargo.toml).
      wasmtime:
        patterns:
          - "wasmtime*"
          - "wit-parser"
          - "wit-component"
          - "wasm-encoder"
          - "wasm-metadata"
          - "wasmparser"
