name: Publish

on:
  push:
    tags: [ "**/v[0-9]*.[0-9]*.[0-9]*" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  Checks:
    # The union of what the called jobs request: the OSV Scanner job
    # uploads SARIF to the Security tab.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/checks.yaml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  Publish:
    needs: Checks
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      # `Checks` has already parsed the tag and checked the crate and its
      # Cargo.toml version against it; this only refuses a version that
      # is already on crates.io.
      - name: Verify crate is in publishable set
        if: ${{ !contains(fromJSON(needs.Checks.outputs.publish), needs.Checks.outputs.tag-package) }}
        env:
          PKG: ${{ needs.Checks.outputs.tag-package }}
          VER: ${{ needs.Checks.outputs.tag-version }}
        run: |
          echo "::error::$PKG $VER is not in the publishable set: it is already on crates.io, or the registry lookup failed."
          exit 1
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish
        env:
          PKG: ${{ needs.Checks.outputs.tag-package }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --all-features --package "$PKG" --verbose
