name: Wasm toolchain

# Bumps wasmtime, wit-bindgen and the wasm-tools crates together onto one
# wasm-tools release (Dependabot ignores them). The version logic lives in
# .github/scripts/wasm-toolchain.sh; `wasm-toolchain.sh plan` is its dry run.

on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions: read-all

jobs:
  Update:
    name: Bump the wasm toolchain
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: Bump pins and lockfiles
        id: bump
        run: .github/scripts/wasm-toolchain.sh apply
      - name: Open pull request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: chore/update-wasm-toolchain
          delete-branch: true
          add-paths: |
            Cargo.toml
            Cargo.lock
            examples/*/Cargo.lock
          commit-message: ${{ steps.bump.outputs.title }}
          title: ${{ steps.bump.outputs.title }}
          body-path: ${{ steps.bump.outputs.body-file }}
          labels: |
            dependencies
            rust
