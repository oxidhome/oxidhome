name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true
    outputs:
      publish:
        value: ${{ jobs.RustMeta.outputs.publish }}
      tag-package:
        value: ${{ jobs.RustMeta.outputs.tag-package }}
      tag-version:
        value: ${{ jobs.RustMeta.outputs.tag-version }}
  schedule:
    - cron: "0 4 * * 1"   # Mondays 04:00 UTC, aligned with wit-deps.yaml

env:
  CARGO_TERM_COLOR: always

# Every job here only clones the repo and runs cargo. Keeping this
# narrow also caps what `publish.yaml` has to grant when it calls this
# workflow.
permissions:
  contents: read

# A new push to a PR cancels that PR's run still in progress, and a new
# push to main cancels the main run it supersedes, so a burst of merges
# only spends CI on the newest commit. A re-run of an older main commit
# keeps its push event and ref, so `run_attempt` keeps it out of the main
# group; otherwise it would cancel the newest commit's run. Every other
# run (re-runs, schedule, and the tag runs where `publish.yaml` calls
# this workflow) gets a group of its own through `run_id`, so it is never
# cancelled and never left pending behind another. Under `workflow_call`, `github.workflow` and `run_id`
# are the caller's, so the `checks-` prefix keeps this group apart from
# any group the caller might declare for itself.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == '1') }}

jobs:
  RustMeta:
    name: Collect crate metadata
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.rustmeta.outputs.matrix }}
      publish: ${{ steps.rustmeta.outputs.publish }}
      tag-package: ${{ steps.rustmeta.outputs.tag-package }}
      tag-version: ${{ steps.rustmeta.outputs.tag-version }}
      rust-version: ${{ steps.rustmeta.outputs.rust-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # On a `<crate>/v<x.y.z>` tag push (`publish.yaml` calls this
      # workflow) the action also parses the tag and fails when the crate
      # is unknown, `publish = false`, or its Cargo.toml version differs
      # from the tag.
      - uses: sv-tools/rust-metadata-action@4020eda3b8b92b4cc9835dfe8d792ec2ace4690e # v1.3.1
        id: rustmeta
      # `publish.yaml` ships one crate per tag and resolves siblings from
      # crates.io, so tags have to be pushed in dependency order, and a
      # crate's first version has to be published by hand: trusted
      # publishing cannot create a crate.
      - name: Report the release order
        if: ${{ steps.rustmeta.outputs.publish != '[]' }}
        env:
          RELEASE_ORDER: ${{ steps.rustmeta.outputs.release-order }}
          NEW_CRATES: ${{ steps.rustmeta.outputs.new-crates }}
        run: |
          set -euo pipefail
          {
            echo "### Release order"
            echo
            echo "One crate per tag, resolved from crates.io; push in this order:"
            echo
            echo '```sh'
            jq -r '.[] | "git push origin \(.)"' <<<"$RELEASE_ORDER"
            echo '```'
            if [[ "$NEW_CRATES" != "[]" ]]; then
              echo
              echo "Not on crates.io yet; run \`cargo publish\` by hand before pushing their tags:"
              echo
              jq -r '.[] | "- `\(.)`"' <<<"$NEW_CRATES"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
  BuildJob:
    name: Build per crate
    needs: RustMeta
    strategy:
      matrix:
        args: ${{ fromJSON(needs.RustMeta.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo build ${{ matrix.args }} --all-targets --verbose
  WasmBuildJob:
    name: Build SDK for wasm32-wasip2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo build --package oxidhome-sdk --target wasm32-wasip2 --all-targets --verbose
      # The SDK's world features are mutually exclusive on wasm; build
      # each world on its own.
      - run: cargo build --package oxidhome-sdk --target wasm32-wasip2 --no-default-features --features streaming-plugin --all-targets --verbose
  ExamplesBuildJob:
    name: Build examples for wasm32-wasip2
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [hello-world, simulated-switch, event-recorder, deferred-switch, script-host, network-discovery]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: Build examples/${{ matrix.example }}
        # `--locked` so a drifted lockfile fails CI loudly instead of
        # being silently resolved on the runner.
        working-directory: examples/${{ matrix.example }}
        run: cargo build --target wasm32-wasip2 --locked --verbose
  MSRV:
    name: Check the minimum supported Rust version
    needs: RustMeta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `rust-version` is the highest `rust-version` any crate declares.
      # The action sets it as a `rustup override`, which wins over
      # `rust-toolchain.toml`.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: ${{ needs.RustMeta.outputs.rust-version }}
          target: wasm32-wasip2
      - run: cargo check --workspace --all-features --all-targets --verbose
      # One SDK world at a time: the world features are mutually
      # exclusive on wasm.
      - run: cargo check --package oxidhome-sdk --target wasm32-wasip2 --all-targets --verbose
      - run: cargo check --package oxidhome-sdk --target wasm32-wasip2 --no-default-features --features streaming-plugin --all-targets --verbose
  Build:
    name: Build
    needs:
      - BuildJob
      - WasmBuildJob
      - ExamplesBuildJob
      - MSRV
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        if: ${{ needs.BuildJob.result != 'success' || needs.WasmBuildJob.result != 'success' || needs.ExamplesBuildJob.result != 'success' || needs.MSRV.result != 'success' }}
        run: exit 1
  Format:
    name: Check Rust code formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo fmt --all --check --verbose
  Wit:
    name: Validate WIT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a PR, HEAD is the merge commit; depth 2 brings in its
          # first parent (the base) for the baseline-immutability diff.
          fetch-depth: 2
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo install-tools
      - name: Verify wit/deps is populated
        run: |
          if [ ! -d wit/deps ] || [ -z "$(ls -A wit/deps 2>/dev/null)" ]; then
            echo "::error::wit/deps is missing or empty. Run 'wit-deps update' locally and commit the result."
            exit 1
          fi
      - name: Verify wit/deps is in sync with wit/deps.toml
        run: |
          wit-deps lock
          if ! git diff --quiet -- wit/deps wit/deps.lock; then
            echo "::error::wit/deps drifted from wit/deps.toml. Run 'wit-deps update' and commit."
            git --no-pager diff -- wit/deps wit/deps.lock
            exit 1
          fi
      - name: Validate WIT package + WASI imports
        run: wasm-tools component wit wit/
      - name: Verify the WIT contract matches its version's baseline
        # Fails when `wit/` changes `oxidhome:plugin` without a package
        # version bump, or when a bump that claims to be compatible
        # isn't (architecture review M1). See CONTRIBUTING.md for the
        # bump-and-bless workflow.
        run: cargo test -p oxidhome-wit --test contract_baseline
      - name: Verify released WIT baselines are unchanged
        # A baseline records a contract version plugins may already
        # target, so a PR may add one but never edit or delete one.
        # Nothing targets a contract before the SDK is published, so
        # the check switches on by itself once `oxidhome-sdk` drops
        # `publish = false`; until then a baseline may be re-blessed
        # in place.
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          sdk_publish=$(cargo metadata --no-deps --format-version 1 \
            | jq -c '.packages[] | select(.name == "oxidhome-sdk") | .publish')
          if [ "$sdk_publish" = "[]" ]; then
            echo "::notice::oxidhome-sdk is unpublished (publish = false); WIT baselines may still change in place."
            exit 0
          fi
          changed=$(git diff --name-only --diff-filter=DMRT HEAD^1 HEAD -- crates/oxidhome-wit/baselines/)
          if [ -n "$changed" ]; then
            echo "::error::Released WIT contract baselines are immutable. Bump the package version in wit/oxidhome.wit and bless a new baseline instead of changing: $changed"
            exit 1
          fi
  Clippy:
    name: Check Rust code with Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo install-tools
      - run: cargo clippy --all-features --all-targets --verbose -- --deny warnings
      - run: cargo clippy --all-features --all-targets --quiet --message-format=json | cargo-action-fmt
        if: failure()
  WasmClippy:
    name: Check SDK with Clippy for wasm32-wasip2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo install-tools
      # One SDK world at a time: the world features are mutually
      # exclusive on wasm.
      - run: cargo clippy --package oxidhome-sdk --target wasm32-wasip2 --all-targets --verbose -- --deny warnings
      - run: cargo clippy --package oxidhome-sdk --target wasm32-wasip2 --no-default-features --features streaming-plugin --all-targets --verbose -- --deny warnings
      - run: cargo clippy --package oxidhome-sdk --target wasm32-wasip2 --all-targets --quiet --message-format=json | cargo-action-fmt
        if: failure()
      - run: cargo clippy --package oxidhome-sdk --target wasm32-wasip2 --no-default-features --features streaming-plugin --all-targets --quiet --message-format=json | cargo-action-fmt
        if: failure()
  Docs:
    name: Check rustdoc
    runs-on: ubuntu-latest
    env:
      # Broken intra-doc links, bare URLs and malformed HTML in doc
      # comments are warnings by default; docs.rs renders them wrong
      # rather than failing, so make them fatal here instead.
      RUSTDOCFLAGS: --deny warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo doc --workspace --all-features --no-deps --verbose
      # Same target-specific pass as `WasmClippy`: the SDK's docs are
      # what plugin authors read, and they build for wasm32-wasip2.
      # One world at a time (mutually exclusive on wasm).
      - run: cargo doc --package oxidhome-sdk --target wasm32-wasip2 --no-deps --verbose
      - run: cargo doc --package oxidhome-sdk --target wasm32-wasip2 --no-default-features --features streaming-plugin --no-deps --verbose
  DocLinks:
    name: Check markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `--offline` checks only links inside the repo (files and, with
      # `--include-fragments`, heading anchors), so a flaky external
      # site can't fail CI. Quoted globs are expanded by lychee; the
      # crate glob matches nothing today and only warns.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --no-progress --include-fragments
            README.md ARCHITECTURE.md CONTRIBUTING.md AGENTS.md
            'docs/**/*.md' 'crates/*/README.md' 'examples/*/README.md'
  DocClaims:
    name: Check docs for stale claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fails on any phrase from `.github/stale-doc-phrases.txt` in the
      # repo docs. ADRs are skipped: they quote what they supersede.
      - name: Grep docs for stale phrases
        run: |
          set -euo pipefail
          patterns="$RUNNER_TEMP/stale-doc-phrases"
          grep -vE '^[[:space:]]*(#|$)' .github/stale-doc-phrases.txt > "$patterns"
          mapfile -d '' files < <(git ls-files -z -- \
            README.md ARCHITECTURE.md CONTRIBUTING.md AGENTS.md \
            'docs/*.md' 'crates/*/README.md' 'examples/*/README.md' \
            ':!:docs/adr/*')
          status=0
          matches=$(grep -HniF -f "$patterns" -- "${files[@]}") || status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
          if [ "$status" -eq 0 ]; then
            while IFS=: read -r file line text; do
              # `%` starts an escape in workflow commands.
              echo "::error file=$file,line=$line::Stale doc claim (see .github/stale-doc-phrases.txt): ${text//%/%25}"
            done <<<"$matches"
            exit 1
          fi
  TestsJob:
    name: Tests per crate
    needs: RustMeta
    strategy:
      matrix:
        args: ${{ fromJSON(needs.RustMeta.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo install-tools
      - name: Pre-build hello-world example for wasm32-wasip2
        # `oxidhome-core`'s Phase 2 integration test invokes
        # `cargo build` on `examples/hello-world`. Pre-building primes
        # the cache and surfaces wasm build failures with a clearer
        # error than the one buried in the test output. `--locked`
        # matches both the test invocation and `ExamplesBuildJob`.
        working-directory: examples/hello-world
        run: cargo build --target wasm32-wasip2 --locked
      - name: Pre-build simulated-switch example for wasm32-wasip2
        # Same shape as hello-world above — Phase 3's
        # `simulated_switch_round_trip` integration test uses this
        # artifact.
        working-directory: examples/simulated-switch
        run: cargo build --target wasm32-wasip2 --locked
      - name: Pre-build event-recorder example for wasm32-wasip2
        # Phase 3's `event_dispatch` integration test pairs the
        # recorder with the switch above to exercise the plugin-side
        # `on-event` dispatch path.
        working-directory: examples/event-recorder
        run: cargo build --target wasm32-wasip2 --locked
      - name: Run tests
        # `--all-features` flips every world feature on for `oxidhome-wit`
        # so all four worlds' compile-only smoke tests run; the other
        # crates have no features beyond default so the flag is a no-op
        # for them.
        working-directory: ${{ github.workspace }}
        run: cargo llvm-cov nextest ${{ matrix.args }} --all-features --all-targets --no-fail-fast --no-tests=pass --verbose
      - name: Prepare coverage report
        if: ${{ !cancelled() }}
        run: cargo llvm-cov report --lcov --output-path coverage.lcov
      # Not sent to Codecov from here: every upload makes Codecov
      # recompute its statuses from the reports it has so far, so a
      # matrix of uploads flips them until the last row lands. The
      # `Coverage` job below sends all of them at once.
      - name: Store coverage and test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-test-${{ strategy.job-index }}
          path: |
            coverage.lcov
            target/nextest/default/junit.xml
          retention-days: 1
  Coverage:
    name: Publish coverage to Codecov
    # One upload for the whole run, once every test job is done, so
    # Codecov computes each status a single time from the complete
    # report. Runs after a test failure too. Deliberately not part of
    # `AllChecks`: the Codecov statuses are informational.
    needs: TestsJob
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # Codecov resolves the report paths against the repository tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # One directory per artifact, so same-named reports from
          # different jobs don't overwrite each other.
          pattern: coverage-*
          path: coverage-reports
      - name: List the reports
        id: reports
        run: |
          set -euo pipefail
          mkdir -p coverage-reports
          list() { find coverage-reports -type f -name "$1" | sort | paste -sd, -; }
          echo "lcov=$(list coverage.lcov)" >> "$GITHUB_OUTPUT"
          echo "junit=$(list junit.xml)" >> "$GITHUB_OUTPUT"
          find coverage-reports -type f | sort
      - name: Upload coverage reports to Codecov
        if: ${{ steps.reports.outputs.lcov != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ steps.reports.outputs.lcov }}
          disable_search: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ steps.reports.outputs.junit != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          files: ${{ steps.reports.outputs.junit }}
          disable_search: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  Tests:
    name: Tests
    needs: TestsJob
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        if: ${{ needs.TestsJob.result != 'success' }}
        run: exit 1
  Buf:
    name: Verify Connect-RPC codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: Install buf CLI
        # Pre-built binary from buf's releases — no Go toolchain
        # needed on the runner just to compile buf itself. No
        # `version:` pin: track the latest buf release so codegen
        # behavior stays aligned with the latest plugins. `buf-action`
        # replaces the archived `buf-setup-action`; `setup_only` installs
        # buf without running lint/format/breaking/push. Resolving
        # "latest" calls the GitHub API, which rate-limits anonymous
        # requests per runner IP, so pass the job's read-only token.
        uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          setup_only: true
          github_token: ${{ github.token }}
      - name: Install codegen plugins (protoc-gen-buffa{,-packaging},
          protoc-gen-connect-rust)
        # The same alias that installs cargo-deny / cargo-nextest /
        # etc. — the Rust codegen plugins live alongside the other
        # workspace toolchain bins.
        run: cargo install-tools
      - name: Lint .proto files
        run: buf lint
      - name: Regenerate Connect-RPC code
        run: buf generate
      - name: Apply rustfmt to the regen tree
        # The committed code is the post-`cargo fmt --all` form (the
        # dev pre-commit gate runs fmt across the whole workspace),
        # so the diff check below has to compare apples to apples.
        # Otherwise the only divergence ends up being rustfmt's
        # `max_width` wrap of buffa's long single-line `#![allow(…)]`
        # attributes, and CI fails on a non-substantive diff.
        run: cargo fmt --all
      - name: Verify committed code matches regen
        # If buf generate produced a different tree than what's
        # committed, the dev forgot to run regen + commit. Fail
        # loudly so the staleness can't reach main.
        run: |
          if ! git diff --quiet -- crates/oxidhome-proto/src/gen; then
            echo "::error::Connect-RPC generated code is stale. Run 'buf generate && cargo fmt --all' locally and commit the result."
            git --no-pager diff -- crates/oxidhome-proto/src/gen
            exit 1
          fi
  Deps:
    name: Check dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo install-tools
      - name: Machete
        run: cargo machete
      - name: Deny
        run: cargo deny check all
  OsvScannerPR:
    name: OSV Scanner (PR diff)
    # Comparative scan: diffs the base branch's dependencies against the
    # PR head and reports newly introduced vulnerable ones. `OsvScanner`
    # below does a flat scan on every other event. Both read
    # `osv-scanner.toml` for ignored advisories.
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write  # SARIF upload to the Security tab
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
  OsvScanner:
    name: OSV Scanner
    # Flat scan of the current tree on push to main, schedule, and the
    # publish flow (`workflow_call`).
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write  # SARIF upload to the Security tab
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
  PublishJob:
    name: Test publishing per crate
    needs: RustMeta
    # Every crate is `publish = false` through 0.x, and an empty matrix
    # is a workflow error, so skip the job until one is publishable.
    if: ${{ needs.RustMeta.outputs.publish != '[]' }}
    strategy:
      matrix:
        package: ${{ fromJSON(needs.RustMeta.outputs.publish) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: Dry run publish
        run: cargo publish --all-features --package ${{ matrix.package }} --dry-run --verbose
      - name: Create package
        run: cargo package --all-features --package ${{ matrix.package }} --verbose
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.package }}-crate
          path: target/package/${{ matrix.package }}-*.crate
  Publish:
    name: Test publishing
    needs:
      - RustMeta
      - PublishJob
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        if: ${{ needs.RustMeta.outputs.publish != '[]' && (needs.PublishJob.result == 'failure' || needs.PublishJob.result == 'cancelled') }}
        run: exit 1
  AllChecks:
    name: All checks
    needs:
      - RustMeta
      - Build
      - Format
      - Wit
      - Buf
      - Clippy
      - WasmClippy
      - Docs
      - DocLinks
      - DocClaims
      - Tests
      - Deps
      - OsvScannerPR
      - OsvScanner
      - Publish
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # Exactly one of `OsvScannerPR` / `OsvScanner` is skipped per event,
      # so `skipped` is expected; every other job always runs.
      - name: Verify all checks succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
