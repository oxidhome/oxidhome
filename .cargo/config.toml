[alias]
# Workspace toolchain installer. Run from a fresh checkout (or before
# CI's gates) to populate every Rust binary the developer flow + CI
# expect on $PATH.
#
# - Test / coverage / publish gates: cargo-deny, cargo-llvm-cov,
#   cargo-machete, cargo-nextest, cargo-action-fmt.
# - WIT pipeline: wit-deps-cli, wasm-tools.
# - Connect-RPC codegen: protoc-gen-buffa, protoc-gen-buffa-packaging,
#   and connectrpc-codegen (which ships the `protoc-gen-connect-rust`
#   binary). `buf` itself isn't a cargo crate; CI installs it via
#   `bufbuild/buf-setup-action` (pre-built binary, no Go toolchain),
#   and local devs typically already have it from a package manager
#   or `go install`.
#
# The three codegen plugins are version-pinned; everything else
# floats. `crates/oxidhome-proto/src/gen/` is committed and the
# `Codegen` CI job fails when `buf generate` disagrees with it, so an
# unpinned plugin turns every unrelated PR red the moment a new
# plugin release lands on crates.io. Each pin must move together with
# its runtime pin in the root `Cargo.toml` (`buffa` / `connectrpc`)
# and a regenerated tree in the same commit.
install-tools = "install --locked cargo-deny cargo-llvm-cov cargo-machete cargo-nextest cargo-action-fmt wit-deps-cli wasm-tools protoc-gen-buffa@0.7.1 protoc-gen-buffa-packaging@0.7.1 connectrpc-codegen@0.7.0"
